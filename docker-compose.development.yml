services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./
      dockerfile: apps/backend/Dockerfile.development
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres
    restart: unless-stopped
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./
      dockerfile: apps/frontend/Dockerfile.development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
    depends_on:
      - backend
    restart: unless-stopped

    ports:
      - "3000:3000"
